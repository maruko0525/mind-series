<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>観察する人物を選択</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#eef6fb;color:#17345c}.app{max-width:720px;margin:auto;padding:28px 16px 120px}
.back{border:0;background:#fff;border-radius:14px;padding:11px 14px;font-weight:800}.card{background:#fff;border-radius:24px;padding:20px;margin-top:18px;box-shadow:0 8px 28px rgba(30,70,110,.08)}h1{font-size:25px;margin:0 0 8px}.note{color:#667085;line-height:1.6;font-size:14px}
.people{display:grid;gap:10px;margin-top:15px}.person{width:100%;border:1px solid #dce6ef;background:#fff;border-radius:16px;padding:15px;text-align:left;font-size:17px;font-weight:850;color:#17345c}.person small{display:block;color:#7a8798;font-size:12px;margin-top:4px}.register{width:100%;border:0;border-radius:16px;padding:15px;background:#348fe8;color:#fff;font-weight:850;font-size:16px;margin-top:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}.modal.on{display:flex}.box{background:#fff;border-radius:22px;padding:20px;width:min(420px,100%)}input{width:100%;padding:13px;border:1px solid #dce3ee;border-radius:12px;font-size:16px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.actions button{border:0;border-radius:13px;padding:12px;font-weight:800}.save{background:#348fe8;color:#fff}
</style></head><body><main class="app"><button class="back" onclick="location.href='human-mind.html'">‹ ホームへ</button>
<section class="card"><h1>観察する人物を選択</h1><p class="note">ここで選んだ人物のデータとして観察結果を保存します。人物名は次の観察画面には表示しません。</p>
<div class="people" id="people"></div><button class="register" onclick="openReg()">＋ 新しい人を登録</button></section></main>
<div class="modal" id="modal"><div class="box"><h2>人物を登録</h2><input id="name" placeholder="名前・ニックネーム"><div class="actions"><button onclick="modal.classList.remove('on')">キャンセル</button><button class="save" onclick="save()">登録</button></div></div></div>
<script>
function getPeople(){try{return JSON.parse(localStorage.getItem("mindPeople")||"[]")}catch(e){return[]}}
function idOf(p,i){return String(p.id??p.key??p.name??i)}
function render(){let ps=getPeople();people.innerHTML=ps.length?ps.map((p,i)=>`<button class="person" onclick="choose('${idOf(p,i).replaceAll("'","&#39;")}')">🙂 ${p.name||p.label||"人物"+(i+1)}<small>観察 ${Array.isArray(p.observations)?p.observations.length:(p.count||0)}回</small></button>`).join(""):'<p class="note">まだ人物が登録されていません。</p>'}
function choose(id){localStorage.setItem("currentMindPerson",id);location.href="human-analysis.html"}
function openReg(){modal.classList.add("on");name.value="";setTimeout(()=>name.focus(),100)}
function save(){let n=name.value.trim();if(!n)return alert("名前かニックネームを入力してください");let ps=getPeople(),id="p_"+Date.now();ps.push({id,name:n,observations:[]});localStorage.setItem("mindPeople",JSON.stringify(ps));modal.classList.remove("on");render()}
render();
</script></body></html>
