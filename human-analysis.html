function render(){let q=$("search").value.trim();let a=DATA.filter(x=>(cat==="すべて"||x.category===cat)&&(!q||x.label.includes(q)||x.category.includes(q)));$("signs").innerHTML=a.map(x=>`<label class="sign ${aiSelected.has(x.id)?"ai":""}"><input type="checkbox" ${selected.has(x.id)?"checked":""} onchange="toggle('${x.id}',this.checked)"><span>${ICONS[x.category]} ${x.label}</span></label>`).join("");$("count").textContent=selected.size}

function analyze(){if(!current())return alert("先に観察する人物を選択してください");let arr=DATA.filter(x=>selected.has(x.id));if(!arr.length)return alert("サインを1つ以上選んでください");let g={};arr.forEach(x=>(g[x.category]??=[]).push(x.label));$("summary").innerHTML=Object.entries(g).map(([k,v])=>`<h3>${ICONS[k]} ${k}</h3><div class="evidence">${v.join(" ・ ")}</div>`).join("");$("result").style.display="block";let ps=people(),i=ps.findIndex((p,n)=>pid(p,n)===current());if(i>=0){ps[i].observations=Array.isArray(ps[i].observations)?ps[i].observations:[];ps[i].observations.unshift({date:new Date().toISOString(),signs:arr.map(x=>x.id)});localStorage.setItem("mindPeople",JSON.stringify(ps))}$("result").scrollIntoView({behavior:"smooth"})}
function goResult(){if($("result").style.display!=="block")analyze();else $("result").scrollIntoView({behavior:"smooth"})}
fillPeople();tabsRender();render();
