<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c2340"><title>Human Mind</title>
<link rel="apple-touch-icon" href="human-mind-icon.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#fff;background:#0c2340}
.hero{min-height:100vh;background:url("human-city-bg.png") center/cover no-repeat;display:flex;align-items:flex-end;padding:24px 18px 122px}
.panel{width:min(600px,100%);margin:auto;background:rgba(8,20,42,.62);backdrop-filter:blur(8px);padding:22px;border-radius:26px}
.brand{font-size:31px;font-weight:900}.lead{margin:8px 0 20px;line-height:1.6}
button{border:0;border-radius:17px;padding:15px 18px;font-size:16px;font-weight:850}.primary{width:100%;background:#4f63df;color:#fff}.register{width:100%;margin-top:10px;background:#fff;color:#17345c}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);color:#667085;padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:20}.nav{max-width:850px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{background:transparent;color:#667085;padding:6px 1px;font-size:10px}.nav span{display:block;font-size:21px}.nav .on{color:#4f63df;background:#eef0ff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}.modal.on{display:flex}.modalbox{width:min(440px,100%);background:#fff;color:#172033;border-radius:24px;padding:20px}.modalbox h2{margin:0 0 12px}.modalbox input{width:100%;padding:13px;border:1px solid #dce3ee;border-radius:13px;font-size:16px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.cancel{background:#eef1f6}.save{background:#4f63df;color:white}
</style></head><body>
<section class="hero"><div class="panel"><div class="brand">🧠 Human Mind</div><p class="lead">観察を重ねて、その人自身の「普段」と比較する。</p>
<button class="primary" onclick="location.href='human-person.html'">👀 観察をはじめる</button>
<button class="register" onclick="openRegister()">＋ 新しい人を登録する</button></div></section>
<div class="bottom"><div class="nav">
<button class="on"><span>⌂</span>ホーム</button><button onclick="location.href='human-person.html'"><span>👀</span>観察</button>
<button onclick="location.href='human-person.html'"><span>🧠</span>分析</button><button onclick="location.href='human-person.html'"><span>📚</span>学習</button>
<button onclick="location.href='index.html'"><span>◫</span>シリーズ</button></div></div>
<div class="modal" id="modal"><div class="modalbox"><h2>人物を登録</h2><input id="newName" placeholder="名前・ニックネーム">
<div class="actions"><button class="cancel" onclick="closeRegister()">キャンセル</button><button class="save" onclick="savePerson()">登録する</button></div></div></div>
<script>
function people(){try{return JSON.parse(localStorage.getItem("mindPeople")||"[]")}catch(e){return[]}}
function openRegister(){modal.classList.add("on");newName.value="";setTimeout(()=>newName.focus(),100)}
function closeRegister(){modal.classList.remove("on")}
function savePerson(){let n=newName.value.trim();if(!n){alert("名前かニックネームを入力してください");return}let ps=people(),id="p_"+Date.now();ps.push({id,name:n,observations:[]});localStorage.setItem("mindPeople",JSON.stringify(ps));localStorage.setItem("currentMindPerson",id);closeRegister();location.href="human-person.html"}
</script></body></html>
