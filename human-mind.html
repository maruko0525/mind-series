<html lang="ja">
<head>

<meta name="theme-color" content="#eef3ff">
<title>Human Mind</title>
<style>

*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#edf2ff 0,#f7f8fc 230px);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.app{max-width:850px;margin:auto;padding:18px 16px 110px}.hero{text-align:center;padding:18px 8px 8px}.brain{font-size:54px}.hero h1{margin:4px 0;font-size:30px;letter-spacing:.04em}.hero p{margin:4px 0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:14px 0;box-shadow:0 8px 26px rgba(37,50,100,.07)}

.search{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 13px;font-size:16px;margin-bottom:10px}

.result{display:none}.meter{height:9px;background:#edf0f5;border-radius:9px;overflow:hidden;margin:6px 0 14px}.meter>i{display:block;height:100%;background:var(--accent);border-radius:9px}.result h3{margin:15px 0 4px}.evidence{font-size:14px;color:#475467}.warn{font-size:12px;color:#667085;background:#f7f8fa;padding:10px;border-radius:12px;line-height:1.5}
.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}.bottomin{max-width:850px;margin:auto;display:flex;gap:10px}.bottom button{flex:1}
@media(max-width:560px){.signs{grid-template-columns:1fr}.hero h1{font-size:27px}}
</style></head>
<body><main class="app">

<section class="card"><h2>分析の始め方</h2><div class="modegrid">
<button class="mode" id="photoMode" onclick="setMode('photo')"><span>📷</span>写真から</button>
<button class="mode active" id="manualMode" onclick="setMode('manual')"><span>👤</span>観察して入力</button></div>

<div id="photoBox" style="display:none;margin-top:12px"><button class="primary" onclick="photoInput.click()">写真を選ぶ / 撮る</button><div class="note">この試作版では写真を端末内でプレビューします。画像AI接続時は、表情・視線・姿勢・動きを仮選択し、ユーザーが自由に補正できる設計です。</div><img id="preview" style="display:none;width:100%;max-height:280px;object-fit:contain;border-radius:16px;margin-top:10px"></div>
</section>

<section class="card"><div class="row"><h2>観察サイン</h2><div class="count"><b id="selectedCount">0</b> / 159 選択</div></div>
<input class="search" id="search" placeholder="サインを検索…" oninput="render()"><div class="tabs" id="tabs"></div><div class="signs" id="signs"></div></section>

<section class="card result" id="result"><h2>🧠 分析メモ</h2><div id="summary"></div>

</main>
<div class="bottom"><div class="bottomin"><button class="ghost" onclick="clearAll()">クリア</button><button class="primary" onclick="analyze()">選択サインを分析</button></div></div>
