<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Human Mind</title><link rel="apple-touch-icon" href="human-mind-icon.png"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#071d45;color:white}.hero{min-height:100vh;background:linear-gradient(rgba(5,18,48,.15),rgba(5,18,48,.52)),url("human-home-bg.jpg") center/cover no-repeat;padding:36px 18px 125px}.wrap{max-width:760px;margin:auto}.brand{font-size:34px;font-weight:900;text-shadow:0 2px 12px #000}.brand small{display:block;font-size:15px;font-weight:600;margin-left:54px}.copy{margin-top:105px;text-shadow:0 3px 14px #000}.copy small{letter-spacing:.14em;font-weight:800}.copy h1{font-size:43px;line-height:1.2;margin:12px 0}.copy p{font-size:17px;line-height:1.7}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:35px}.action{border:0;border-radius:22px;padding:20px 15px;text-align:left;font-weight:900;font-size:18px}.action small{display:block;font-size:13px;font-weight:600;margin-top:5px}.register{background:white;color:#17345c}.observe{background:#1674ed;color:white}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}.nav{max-width:850px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:transparent;color:#607086;padding:6px 1px;font-size:10px}.nav span{display:block;font-size:21px}.nav .on{color:#1674ed;background:#eef5ff}.modal{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.on{display:flex}.box{width:min(430px,100%);background:white;color:#172033;border-radius:23px;padding:20px}.box input{width:100%;padding:14px;border:1px solid #dce4ef;border-radius:13px;font-size:16px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.buttons button{border:0;border-radius:13px;padding:13px;font-weight:800}.save{background:#1674ed;color:white}@media(max-width:560px){.copy h1{font-size:36px}.actions{grid-template-columns:1fr}}
.manage{width:100%;margin-top:12px;border:1px solid #fff;background:#17345ccc;color:#fff;border-radius:17px;padding:14px;font-weight:800}.personrow{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #ddd}.personrow b{flex:1}.delete{border:0;background:#feeceb;color:#b42318;border-radius:11px;padding:9px 12px;font-weight:800}</style></head><body><section class="hero"><div class="wrap"><div class="brand">🧠 Human Mind<small>人の気持ちを、もっと深く</small></div><div class="copy"><small>UNDERSTAND PEOPLE, A KINDER WORLD</small><h1>人を知る。<br>もっとやさしい世界へ。</h1><p>観察を重ねるほど見えてくる、その人自身の「普段」。<br>違いを理解することが、よりよい関係のはじまりです。</p></div><div class="actions"><button class="action register" onclick="openReg()">👤＋ 新しい人を登録する<small>観察する人を追加</small></button><button class="action observe" onclick="location.href='human-analysis.html'">👀 観察をはじめる<small>登録済みの人を選んで観察</small></button></div><button class="manage" onclick="openManage()">⚙️ 登録した人を管理する</button></div></section>
<div class="bottom"><div class="nav"><button class="on"><span>⌂</span>ホーム</button><button onclick="location.href='human-analysis.html'"><span>👀</span>観察</button><button onclick="location.href='human-analysis.html#result'"><span>🧠</span>分析</button><button onclick="location.href='human-analysis.html#learning'"><span>📚</span>学習</button><button onclick="location.href='index.html'"><span>◫</span>シリーズ</button></div></div>
<div class="modal" id="manageModal"><div class="box"><h2>登録した人を管理</h2><p>削除すると、その人の過去の観察・分析データと背景画像も削除されます。</p><div id="personList"></div><div class="buttons" style="grid-template-columns:1fr"><button onclick="closeManage()">閉じる</button></div></div></div><div class="modal" id="modal"><div class="box"><h2>新しい人を登録</h2><input id="newName" placeholder="名前・ニックネーム"><div class="buttons"><button onclick="closeReg()">キャンセル</button><button class="save" onclick="savePerson()">登録する</button></div></div></div>
<script>function people(){try{return JSON.parse(localStorage.getItem("mindPeople")||"[]")}catch(e){return[]}}function openReg(){modal.classList.add("on");newName.value=""}function closeReg(){modal.classList.remove("on")}function savePerson(){let n=newName.value.trim();if(!n)return alert("名前かニックネームを入力してください");let ps=people(),id="p_"+Date.now();ps.push({id:id,name:n,observations:[]});localStorage.setItem("mindPeople",JSON.stringify(ps));localStorage.setItem("currentMindPerson",id);closeReg();alert("登録しました")}
function pid(p,i){return String(p.id??p.key??p.name??i)}
function pname(p,i){return p.name||p.label||('人物'+(i+1))}
function openManage(){renderPeople();manageModal.classList.add('on')}
function closeManage(){manageModal.classList.remove('on')}
function renderPeople(){let ps=people(),el=document.getElementById('personList');el.innerHTML=ps.length?ps.map((p,i)=>'<div class="personrow"><b>'+pname(p,i)+'</b><button class="delete" onclick="deletePerson('+i+')">削除</button></div>').join(''):'<p>登録されている人はいません。</p>'}
function deletePerson(i){let ps=people();if(!ps[i])return;let id=pid(ps[i],i),n=pname(ps[i],i);if(!confirm('「'+n+'」を削除しますか？\n\n過去の観察・分析データもすべて削除されます。'))return;localStorage.removeItem('humanmind_person_bg_'+id);ps.splice(i,1);localStorage.setItem('mindPeople',JSON.stringify(ps));if(localStorage.getItem('currentMindPerson')===id)localStorage.setItem('currentMindPerson',ps.length?pid(ps[0],0):'');renderPeople()}
</script></body></html>
